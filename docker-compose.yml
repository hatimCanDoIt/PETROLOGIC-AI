services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: petrologic
      POSTGRES_USER: petrologic
      POSTGRES_PASSWORD: petrologic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petrologic -d petrologic"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql+asyncpg://petrologic:petrologic@db:5432/petrologic
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
