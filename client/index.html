<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fafafa' stroke='%23e4e4e7'/%3E%3Cpath d='M10 14 V50 M22 14 V50 M34 14 V50 M46 14 V50' stroke='%2394a3b8' stroke-width='2' fill='none' opacity='0.9'/%3E%3Cpath d='M16 18 Q22 24 16 30 Q10 36 16 42 L16 50' stroke='%230284c7' stroke-width='2.4' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color-meta" name="theme-color" content="#ffffff" />
    <title>PETROLOGIC AI &middot; Well Log Analysis</title>
    <script>
      (function () {
        try {
          var k = 'petrologic-theme'
          var pref = localStorage.getItem(k)
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = pref === 'dark' ? true : pref === 'light' ? false : sysDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.getElementById('theme-color-meta')
          if (meta) meta.content = dark ? '#09090b' : '#ffffff'
        } catch (_) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-text font-sans">
    <div id="root"></div>
    <div id="tooltip" class="pointer-events-none fixed z-50"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
